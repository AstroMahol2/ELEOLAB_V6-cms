# ============================================================================
# Decap CMS — configurazione del pannello EleoLab
#
# ATTENZIONE AI PERCORSI: sono relativi alla RADICE DEL REPOSITORY, non alla
# cartella del sito. Questo file presume che il contenuto di questa cartella
# sia la radice del repository (index.html in cima).
# Se invece carichi su GitHub la cartella che contiene questa, anteponi il suo
# nome a "folder" e a "media_folder" — vedi LEGGIMI-CMS.txt.
# ============================================================================

backend:
  name: git-gateway
  branch: main            # se il ramo si chiama master, cambia qui

# Dove il CMS salva le immagini caricate, e con quale percorso il sito le legge
media_folder: "assets/prodotti"
public_folder: "/assets/prodotti"

# Nessun site_url/display_url fissato: il pannello usa il sito su cui si trova,
# qualunque esso sia. Cosi non punta piu a un indirizzo sbagliato.
logo_url: /assets/logo-eleolab.png
locale: "it"

collections:
  - name: "prodotti"
    label: "Prodotti"
    label_singular: "Prodotto"
    folder: "prodotti"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: titolo
    summary: "{{titolo}} — {{prezzo}} €"
    sortable_fields: ["titolo", "prezzo", "categoria"]
    view_filters:
      - label: "Solo in vendita"
        field: archiviato
        pattern: false
      - label: "Solo archiviati"
        field: archiviato
        pattern: true
    editor:
      preview: false

    fields:
      - label: "Titolo"
        name: "titolo"
        widget: "string"
        hint: "Il nome del pezzo, come appare nel catalogo. Es: Peonia di seta"

      - label: "Prezzo (€)"
        name: "prezzo"
        widget: "number"
        value_type: "float"
        min: 0
        step: 1
        hint: "Solo il numero, senza simbolo dell euro"

      # --- COPERTINA -------------------------------------------------------
      # E' l'unica foto che si vede nella pagina Prodotti: sceglila bene.
      - label: "Foto di copertina"
        name: "immagine"
        widget: "image"
        allow_multiple: false
        hint: "La foto del catalogo. Verticale 4:5, lato lungo 1600 px. Passala prima da tools/prepara-foto.cmd"

      # --- GALLERIA --------------------------------------------------------
      # Cinque posti per le foto della scheda prodotto. Riempi quelli che
      # servono: i posti lasciati vuoti non compaiono sul sito.
      - label: "Galleria della scheda prodotto"
        name: "galleria"
        widget: "object"
        collapsed: false
        required: false
        hint: "Fino a 5 foto, lato lungo 1600 px. I posti vuoti vengono saltati"
        fields:
          - { label: "Foto 1", name: "foto1", widget: "image", required: false }
          - { label: "Foto 2", name: "foto2", widget: "image", required: false }
          - { label: "Foto 3", name: "foto3", widget: "image", required: false }
          - { label: "Foto 4", name: "foto4", widget: "image", required: false }
          - { label: "Foto 5", name: "foto5", widget: "image", required: false }

      - label: "Descrizione"
        name: "descrizione"
        widget: "text"
        required: false
        hint: "Il racconto del pezzo: materiali, lavorazione, tempi"

      # Guida i filtri della pagina Prodotti: e un elenco chiuso, cosi i valori
      # combaciano sempre con i pulsanti del catalogo
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        default: "sartoria"
        options:
          - { label: "Sartoria", value: "sartoria" }
          - { label: "Maglieria", value: "maglieria" }
          - { label: "Fiori in seta", value: "fiori" }
          - { label: "Accessori", value: "accessori" }

      # Parole chiave per la ricerca interna e per l indicizzazione
      - label: "Tag (SEO)"
        name: "tag"
        widget: "list"
        required: false
        default: []
        hint: "Una parola chiave per riga. Es: seta, fatto a mano, Firenze"

      - label: "Materiale (riga breve)"
        name: "materiale"
        widget: "string"
        required: false
        hint: "La riga piccola sotto la foto. Es: Seta · pezzo unico"

      - label: "In evidenza"
        name: "evidenza"
        widget: "boolean"
        default: false
        required: false
        hint: "Se attivo, il pezzo compare tra i primi del catalogo"

      # --- ARCHIVIO --------------------------------------------------------
      # Toglie il pezzo dal sito senza cancellarlo: resta qui nel pannello e
      # basta rimettere l'interruttore su spento per farlo tornare online.
      - label: "Archiviato (nascosto dal sito)"
        name: "archiviato"
        widget: "boolean"
        default: false
        required: false
        hint: "Acceso = il pezzo sparisce dal catalogo ma non viene cancellato"
